version: "2"
sql:
  - engine: postgresql
    schema: internal/platform/data/migrations
    queries:
      - queries/note.sql
    gen:
      go:
        package: store
        out: internal/modules/notes/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        output_files_suffix: .gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
