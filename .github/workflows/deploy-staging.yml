name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Build images
        run: |
          docker build -t "$REGISTRY/backend:$SHA" backend
          docker build -f infra/caddy/Dockerfile -t "$REGISTRY/edge:$SHA" .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGISTRY }}/backend:${{ github.event.workflow_run.head_sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push with SBOM and provenance, sign
        run: |
          for img in backend edge; do
            ctx=backend; file=backend/Dockerfile
            [ "$img" = edge ] && ctx=. && file=infra/caddy/Dockerfile
            docker buildx build --push --sbom=true --provenance=mode=max -f "$file" -t "$REGISTRY/$img:$SHA" --metadata-file "/tmp/$img.json" "$ctx"
            digest=$(jq -r '."containerimage.digest"' "/tmp/$img.json")
            cosign sign --yes "$REGISTRY/$img@$digest"
            echo "$img=$REGISTRY/$img@$digest" >> "$GITHUB_ENV"
          done
      - name: Migrate
        run: |
          gcloud run jobs update "${{ vars.APP_NAME }}-migrate" --region "$REGION" --image "$backend" --quiet
          gcloud run jobs execute "${{ vars.APP_NAME }}-migrate" --region "$REGION" --wait --quiet
      - name: Roll out
        run: |
          gcloud run jobs update "${{ vars.APP_NAME }}-drain" --region "$REGION" --image "$backend" --quiet
          gcloud run services update "${{ vars.APP_NAME }}-api" --region "$REGION" --image "$backend" --quiet
          gcloud run services update "${{ vars.APP_NAME }}-edge" --region "$REGION" --image "$edge" --quiet
      - name: Verify
        run: |
          for _ in $(seq 1 20); do
            curl -fsS "${{ vars.STAGING_EDGE }}/livez" && exit 0
            sleep 6
          done
          exit 1
